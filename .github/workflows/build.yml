name: Build ChestCounter.exe
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/ChestCounter/ChestCounter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: ChestCounter
          path: dist/ChestCounter.exe

  # Publishes the release with the GitHub CLI (no third-party action, write access only here).
  release:
    # Publie une version quand le numéro <Version> du .csproj change (sur main), ou sur un tag vX.Y.Z.
    # Les ChestCounter installés la trouvent via « Mises à jour » et se mettent à jour tout seuls.
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ChestCounter
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/ChestCounter/ChestCounter.csproj | head -1)
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "La version $TAG existe déjà : rien à publier (change <Version> pour publier)."
          else
            gh release create "$TAG" dist/ChestCounter.exe --target "$GITHUB_SHA" --title "ChestCounter $TAG" --notes "Télécharge **ChestCounter.exe** et ouvre-le (Windows 10 / 11, sans installation). Si tu l'as déjà, il se met à jour tout seul." --latest --repo "$GITHUB_REPOSITORY"
          fi
